# Temporal: prueba desde un runner de GitHub (que sí llega a Google) si el
# formulario de la Evaluación N.º 2 acepta envíos anónimos. Se borra al terminar.
# Corrida 3: después de publicar el formulario.
name: prueba-formulario
on:
  workflow_dispatch:
  push:
    branches: [main-sdxtks]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: estado de los dos formularios
        run: |
          N2="https://docs.google.com/forms/d/e/1FAIpQLSdyJf5kxUNfZcyTTmUEzSQzIsZrDq2dKMHqkoernxYFPTH1Iw/viewform"
          N1="https://docs.google.com/forms/d/e/1FAIpQLSchU6WZlvWRgsX5V3KfqXtfgaBcx3us2asYQP1r8bMhR4U-hA/viewform"
          echo "eval1 viewform: $(curl -sS -o /dev/null -w '%{http_code}' "$N1")"
          echo "eval2 viewform: $(curl -sS -o vf.html -w '%{http_code}' "$N2")"
          echo "eval2 entradas: $(grep -o 'entry\.[0-9]*' vf.html | sort -u | tr '\n' ' ')"
      - name: envío de prueba a la N.º 2
        run: |
          URL="https://docs.google.com/forms/d/e/1FAIpQLSdyJf5kxUNfZcyTTmUEzSQzIsZrDq2dKMHqkoernxYFPTH1Iw/formResponse"
          curl -sS -o fr.html -w 'eval2 formResponse: %{http_code}\n' \
            -F entry.2125593735=Prueba -F entry.1686592593=Runner -F entry.1807448646="8.º" \
            -F entry.1465980799=7,2 -F entry.1260724892="18 de 25" -F entry.490072709="1✔ 2✘" "$URL" || true
          echo "título: $(grep -o '<title>[^<]*</title>' fr.html | head -1)"
          echo "confirmación: $(grep -o -i 'registrad[ao]' fr.html | head -1)"
